name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: Lint, tipi e prove (TypeScript)
    runs-on: ubuntu-24.04
    # Di solito 7 minuti (D258). I limiti stretti sono sui passi; quello del lavoro lascia il tempo
    # a un'installazione lenta dei pacchetti di Ubuntu (D286).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmg
          POSTGRES_PASSWORD: mmg
          POSTGRES_DB: mmg_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmg -d mmg_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mmg:mmg@localhost:5432/mmg_dev
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium per le prove dell'interfaccia
        run: pnpm --filter @mmg/api exec playwright install --with-deps chromium
      - name: Lint, formattazione e tipi
        # Di solito 2 minuti.
        timeout-minutes: 10
        run: pnpm lint
      - name: Prove
        # Di solito 6 minuti.
        timeout-minutes: 20
        run: pnpm exec vitest run

  # La stessa prova dell'interfaccia con gli altri motori (D155): WebKit è il motore di Safari su
  # Mac e iPad. Chromium (Chrome, Edge) è già nel lavoro sopra.
  interfaccia:
    name: Interfaccia con ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    # Di solito 5 minuti. L'installazione del browser con i pacchetti di Ubuntu ha preso anche 18
    # minuti (D286): il limite del lavoro le lascia il tempo, quello delle prove è sul loro passo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmg
          POSTGRES_PASSWORD: mmg
          POSTGRES_DB: mmg_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmg -d mmg_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mmg:mmg@localhost:5432/mmg_dev
      TZ: Europe/Rome
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser per la prova
        run: pnpm --filter @mmg/api exec playwright install --with-deps ${{ matrix.browser }}
      - name: Versione del browser
        working-directory: apps/api
        run: >-
          node -e "require('playwright')[process.env.E2E_BROWSER].launch()
          .then(async (b) => { console.log(process.env.E2E_BROWSER, b.version()); await b.close(); })"
      - name: Prova dell'interfaccia
        # Ogni prova scritta appena finisce: se il lavoro si ferma, si vede dopo quale (D258). Di
        # solito 4 minuti: una prova bloccata si ferma qui invece che dopo sei ore (D258, D286).
        timeout-minutes: 15
        run: pnpm exec vitest run apps/api/test/e2e/interfaccia.test.ts --reporter=verbose

  # La dimostrazione nel browser (D221, D223): costruita e provata dentro una cornice con la
  # sandbox dell'artifact, con i tre motori.
  dimostrazione:
    name: Dimostrazione con ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    # Di solito 7 minuti (D258); il limite del lavoro lascia il tempo all'installazione lenta del
    # browser, quello delle prove è sul loro passo (D286).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      TZ: Europe/Rome
      DEMO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser per la prova
        run: pnpm --filter @mmg/demo exec playwright install --with-deps ${{ matrix.browser }}
      - name: Costruzione della dimostrazione
        run: pnpm --filter @mmg/demo build
      - name: Prova della dimostrazione
        # Come `test:browser`, con ogni prova scritta appena finisce (D258). Il parametro va a
        # vitest direttamente: dopo il nome dello script pnpm lo prenderebbe per sé. Di solito 6
        # minuti: una prova bloccata si ferma qui (D258, D286).
        timeout-minutes: 15
        run: pnpm --filter @mmg/demo exec vitest run --config vitest.browser.config.ts --reporter=verbose

  sync:
    name: Prove di sync/ (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove delle banche dati
        working-directory: sync
        run: python3 -m unittest -v test_banche_dati
